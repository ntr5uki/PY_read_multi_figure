[project]
name = "py-read-multi-figure"
version = "0.1.0"
description = "Interactive image viewer for Jupyter notebooks with ROI selection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.0",
    "ipywidgets>=8.0.0",
    "ipykernel>=6.29.5",
    "pillow>=11.2.1",
    "h5py>=3.14.0",
    "ipyfilechooser>=0.6.0",
    "matplotlib>=3.10.3",
    "ipympl>=0.9.7",
    "simpleeval>=1.0.3",
    "scipy>=1.16.0",
]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# [project.scripts]
# 可选：如果需要命令行入口点
# interactive-viewer = "pynbgui.interactive_image_viewer:main"

[project.entry-points."pynbgui"]
# 自定义入口点组，方便其他项目发现
interactive_viewer = "pynbgui.interactive_image_viewer:InteractiveImageViewer"

[project.urls]
Homepage = "https://github.com/yourusername/py-read-multi-figure"
Repository = "https://github.com/yourusername/py-read-multi-figure"
Issues = "https://github.com/yourusername/py-read-multi-figure/issues"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pynbgui"]

[tool.hatch.build.targets.sdist]
include = [
    "/pynbgui",
    "/README.md",
    "/pyproject.toml",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
